<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --campus-ink: #193331;
            --campus-muted: #637673;
            --campus-green: #176b60;
            --campus-wash: #f3f7f5;
        }
        body {
            min-height: 100vh;
            background: var(--campus-wash);
            color: var(--campus-ink);
        }
        .campus-navbar {
            background: var(--campus-green);
        }
        .campus-main {
            min-height: calc(100vh - 128px);
        }
        .campus-card {
            border-color: #dce5e2;
            border-radius: .5rem;
            box-shadow: 0 8px 24px rgb(25 51 49 / 5%);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark campus-navbar">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">CampusConnect</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    {% if user.is_authenticated %}
                    <span class="navbar-text text-white">Hi, {{ user.username }}</span>
                    <a class="nav-link" href="{% url 'profile' %}">Edit profile</a>
                    <form class="d-flex" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
                    </form>
                    {% else %}
                    <a class="nav-link" href="{% url 'login' %}">Log in</a>
                    <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    {% if messages %}
    <div class="container pt-3" aria-live="polite">
        {% for message in messages %}
        <div class="alert {% if 'error' in message.tags %}alert-danger{% else %}alert-{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show mb-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="campus-main py-4">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
